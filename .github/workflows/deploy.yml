name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 这些是公开的豆瓣/网易云 ID，与本地 .env 保持一致；
    # 缺任一项会退回本地示例数据（电影/图书变占位、歌单为空）。
    env:
      DOUBAN_USER_ID: "274633773"
      NETEASE_PLAYLIST_ID: "18550578176"
      NETEASE_USER_ID: "1731527634"
      NETEASE_TRACK_LIMIT: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # 路由闸门：dist 路由与 tools/route-baseline.json 不一致就 fail，
      # 防止 sync 出错或重构导致页面被静默丢弃（预期改动请本地 npm run baseline:routes 后一并提交）
      - run: npm run check:routes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
